# OSDHYAN API — served by XAMPP Apache + mod_php on port 8000.
# Included from C:\xampp\apache\conf\httpd.conf (see scripts/host/HOSTING.md).
# Replaces `php artisan serve`, which handles one request at a time.

Listen 127.0.0.1:8000

<VirtualHost 127.0.0.1:8000>
    ServerName osdhyan-api.local
    DocumentRoot "C:/dev/test-series-platform/backend/public"

    <Directory "C:/dev/test-series-platform/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [QSA,L]
        </IfModule>
    </Directory>

    # Behind the Next.js proxy / Cloudflare tunnel (Laravel also trusts
    # X-Forwarded-* itself via trustProxies).
    <IfModule mod_remoteip.c>
        RemoteIPHeader X-Forwarded-For
    </IfModule>

    ErrorLog "logs/osdhyan-api-error.log"
    CustomLog "logs/osdhyan-api-access.log" combined
</VirtualHost>
