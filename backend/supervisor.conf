; Program definitions — placed in /etc/supervisor/conf.d/ by the Dockerfile.
; The [supervisord] block lives in the package's /etc/supervisor/supervisord.conf

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker (result emails, AI insights/explanations). Set RUN_WORKERS=0
; on extra web instances so only one runs workers.
[program:queue]
command=/bin/sh -c 'if [ "${RUN_WORKERS:-1}" = "1" ]; then exec php /var/www/osdhyan/artisan queue:work --queue=mail,default,ai --sleep=3 --tries=3 --max-time=3600 --memory=256; else exec sleep infinity; fi'
directory=/var/www/osdhyan
autostart=true
autorestart=true
user=www-data
stopwaitsecs=330
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c 'if [ "${RUN_WORKERS:-1}" = "1" ]; then exec php /var/www/osdhyan/artisan schedule:work; else exec sleep infinity; fi'
directory=/var/www/osdhyan
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
