; OSDHYAN php-fpm pool overrides (applied after the image's www.conf).
;
; Size workers to the instance: each Laravel worker uses ~40-60 MB.
;   1 GB RAM  → FPM_MAX_CHILDREN=12
;   2 GB RAM  → FPM_MAX_CHILDREN=25
;   4 GB RAM  → FPM_MAX_CHILDREN=50
; Requests mostly wait on Postgres/Redis, so 4-8 workers per CPU core is fine.

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE}
pm.max_spare_servers = ${FPM_MAX_SPARE}
pm.max_requests = 1000
; Queue requests instead of refusing them during bursts (e.g. test start).
listen.backlog = 4096
request_terminate_timeout = 65s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
